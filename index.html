<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Krpano to HTML Conversion</title>
    <style>
        /* * [1] CSS 변수 설정 
         * krpano의 <cssstyles> :root 부분과 동일합니다.
         */
        :root {
            --color1-rgb: 255,255,255;
            --color2-rgb: 255,255,255;
            --color3-rgb: 10,10,10;
        }

        /* 테마별 변수 재설정 (data-theme 속성에 따라 변경) */
        [data-theme="darkmode"] {
            --color1-rgb: 30,30,30;
            --color2-rgb: 100,100,100;
            --color3-rgb: 200,200,200;
        }

        [data-theme="blue"] {
            --color1-rgb: 200,200,255;
            --color2-rgb: 0,0,128;
            --color3-rgb: 0,0,10;
        }

        /* 화면을 꽉 채우고 배경색을 넣음 (패널의 유리 효과를 잘 보여주기 위함) */
        body {
            margin: 0;
            height: 100vh;
            background: #9f9696;
            display: flex; /* 레이아웃 잡기 편하게 설정 */
            justify-content: center; /* 가로 중앙 정렬 */
            overflow: hidden;
        }

        /* * [2] theme_panel 스타일 
         * krpano의 <layer name="theme_panel"> 속성들을 CSS로 변환
         */
        /* * [Modified] Dashboard Layout (Car Interface Style) */
        .dashboard-container {
            /* 화면 중앙 정렬 */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            
            /* 넓은 비율 (Landscape) */
            width: 950px; /* 너비 조금 더 확보 */
            height: 650px; /* 높이 증가 (550px -> 650px) */
            
            /* 좌우 분할 레이아웃 */
            display: flex;
            flex-direction: row;
            
            /* Glassmorphism Base */
            background: rgba(var(--color3-rgb), 0.3);
            border: 1px solid rgba(var(--color1-rgb), 0.1);
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0, 0.6);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            
            z-index: 5;
            overflow: hidden; /* 전체 컨테이너는 hidden 유지 */
        }

        /* 1. Left Sidebar */
        .sidebar {
            width: 200px;
            background: rgba(var(--color3-rgb), 0.2); /* 본문보다 조금 더 어둡게 */
            border-right: 1px solid rgba(var(--color1-rgb), 0.1);
            display: flex;
            flex-direction: column;
            padding: 40px 30px;
        }

        .sidebar-header h2 {
            margin: 0 0 40px 0;
            font-size: 28px;
            color: rgba(var(--color1-rgb), 0.9);
            font-weight: 700;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar-menu li {
            font-size: 18px;
            color: rgba(var(--color1-rgb), 0.5);
            cursor: pointer;
            transition: color 0.3s;
        }

        .sidebar-menu li.active {
            color: rgba(var(--color1-rgb), 1.0);
            font-weight: 600;
        }

        /* 2. Right Content Area */
        .content-area {
            flex: 1; /* 남은 공간 차지 */
            padding: 50px 60px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* 중앙 정렬 -> 상단 정렬 (스크롤 시 자연스럽게) */
            overflow-y: auto; /* 내용 넘치면 스크롤 */
        }
        
        /* 스크롤바 숨기기 (옵션) */
        .content-area::-webkit-scrollbar {
            display: none; /* [Modified] 아예 숨김 */
        }
        
        .character-container::-webkit-scrollbar {
            display: none; /* [NEW] 카드 컨테이너 스크롤바 숨김 */
        }

        .content-header h3 {
            margin: 0 0 5px 0;
            font-size: 24px;
            font-weight: 600;
            color: rgba(var(--color1-rgb), 1.0);
        }

        .content-header p {
            margin: 0 0 30px 0;
            font-size: 14px;
            color: rgba(var(--color1-rgb), 0.6);
        }

        /* Choices Grid (설정 버튼들) - Grid Layout */
        .choices-grid {
            display: grid;
            grid-template-columns: 1fr; /* [Modified] 1열 배치로 변경하여 잘림 방지 */
            gap: 15px; /* 카드 간 간격 조정 */
            width: 100%;
        }

        /* [Modified] Card Style for each Group */
        .choice-group {
            display: flex;
            flex-direction: row; /* [Modified] 카드는 가로 배치 (라벨 - 버튼들) */
            justify-content: space-between;
            align-items: center;
            
            background: rgba(var(--color1-rgb), 0.03);
            border: 1px solid rgba(var(--color1-rgb), 0.1);
            border-radius: 20px;
            padding: 15px 25px;
            
            transition: transform 0.3s ease;
        }
        
        .choice-group:hover {
            background: rgba(var(--color1-rgb), 0.07);
            transform: translateY(-2px);
        }
        
        /* Remove old border style */
        .choice-group:last-child {
            border-bottom: 1px solid rgba(var(--color1-rgb), 0.1);
        }

        .group-label {
            font-size: 15px; /* 폰트 크기 미세 조정 */
            color: rgba(var(--color1-rgb), 0.7);
            font-weight: 600;
            margin-bottom: 0; /* [Modified] 가로 배치이므로 하단 여백 제거 */
            margin-right: 20px; /* 라벨과 버튼 사이 간격 */
            width: 80px; /* 라벨 고정 너비 */
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Row Override for Alignment */
        .choice-row {
            display: flex; /* [Fix] Flex 속성 복구 */
            align-items: center;
            justify-content: flex-end; /* [Modified] 버튼 끝으로 정렬 */
            width: auto; /* width auto로 변경 */
            flex: 1; /* 남은 공간 차지 */
            gap: 10px;
        }

        /* [NEW] Character Card Style (Result View) */
        .character-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            padding: 30px 40px; /* [Fix] 세로 여백 줄임 (60->30)하여 전체 내용이 짤리지 않게 함 */
            perspective: 1000px;
            width: 100%;
            height: 430px; /* [Fix] 카드 크기 증가에 따라 컨테이너 높이도 증가 (380 -> 430) */
            overflow-x: visible; 
            box-sizing: border-box; /* 패딩 포함 계산 */
        }

        .character-card {
            width: 140px; /* [Fix] 너비 추가 확대 (290 -> 320) */
            height: 350px; 
            background: rgba(var(--color2-rgb), 0.15);
            border: 1px solid rgba(var(--color1-rgb), 0.1);
            border-radius: 25px;
            
            display: flex;
            flex-direction: column;
            overflow: hidden;
            
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            box-sizing: border-box; /* [Fix] 보더 두께 변경 시 레이아웃 흔들림 방지 */
            flex-shrink: 0; /* [Fix] 화면이 좁아져도 카드가 찌그러지지 않고 너비(320px) 유지 */
        }

        /* Winner Type (Active Group) - Default State */
        .character-card.winner-type {
            transform: scale(1.0);
            border: 1px solid rgba(var(--color1-rgb), 0.4);
            background: rgba(var(--color2-rgb), 0.25);
            box-shadow: 0 5px 10px rgba(0,0,0, 0.3);
        }

        .character-card.winner-type:hover {
            transform: scale(1) translateY(-5px);
            opacity: 0.8;
            border: 1px solid rgba(var(--color1-rgb), 0.0);
        }

        /* Loser Type (Disabled Group) - Now Selectable */
        .character-card.disabled {
            transform: scale(0.85);
            opacity: 0.5;
            filter: grayscale(80%);
            cursor: pointer; /* Clickable */
            border: 1px dashed rgba(var(--color1-rgb), 0.1);
            transition: all 0.4s ease;
        }

        /* Hover effect for disabled cards to hint interactivity */
        .character-card.disabled:hover {
            transform: scale(0.9);
            opacity: 0.8;
            filter: grayscale(20%);
            border: 1px solid rgba(var(--color1-rgb), 0.3);
        }

        /* Selected State (User Choice) - White Theme */
        .character-card.selected {
            transform: scale(1) translateY(-10px) !important;
            border: 2px solid #ffffff;
            background: rgba(255, 255, 255, 0.95); /* Opaque White */
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.6);
            z-index: 10;
        }

        /* [NEW] Text visibility for Selected Card (Dark on White) */
        .character-card.selected .card-info {
            background: rgba(0, 0, 0, 0.05); /* Very light contrast */
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }
        
        .character-card.selected .card-info h4 {
            color: #1a1a1a;
            font-weight: 800;
        }
        
        .character-card.selected .card-info p {
            color: #444;
            font-weight: 500;
        }

        .character-card.selected .card-image-placeholder {
            color: #aaa; /* Placeholder text darker */
        }
        
        /* Start Button Disabled State */
        .start-button {
            width: 120px; 
            background: rgba(var(--color1-rgb), 0.8); 
            color: #333;
            transition: all 0.3s;
        }
        .start-button.disabled {
            background: rgba(var(--color1-rgb), 0.2) !important;
            color: rgba(var(--color1-rgb), 0.4) !important;
            cursor: not-allowed;
        }

        .card-image-placeholder {
            flex: 1;
            background: linear-gradient(to bottom, rgba(var(--color1-rgb), 0.05), rgba(var(--color1-rgb), 0.0));
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: rgba(var(--color1-rgb), 0.4);
        }

        .card-info {
            height: 70px;
            background: rgba(var(--color3-rgb), 0.4);
            padding: 12px;
            text-align: center;
        }

        .card-info h4 {
            margin: 0 0 4px 0;
            color: rgba(var(--color1-rgb), 1.0);
            font-size: 16px;
        }

        .card-info p {
            margin: 0;
            color: rgba(var(--color1-rgb), 0.6);
            font-size: 12px;
        }

        /* [Modified] Apple Vision Pro Style Button */
        /* [Modified] Refined Glass Outline Button (Referencing 'Learn more' style) */
        .select-button {
            /* 크기 설정 (Pill Shape) */
            width: 140px;
            height: 50px;
            
            /* 내부 텍스트 중앙 정렬 */
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* 폰트 스타일 - 깔끔하고 가독성 높게 */
            font-size: 16px;
            font-weight: 500;
            color: rgba(var(--color1-rgb), 1);
            letter-spacing: 0.5px;
            
            /* 기본 버튼 스타일 - Glassmorphism + Minimal Outline */
            background: rgba(255, 255, 255, 0.05); /* 아주 옅은 배경 */
            border: 1px solid rgba(255, 255, 255, 0.3); /* 은은한 테두리 */
            border-radius: 100px; /* 완전 둥근 형태 (Pill) */
            
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
            
            /* 유리 질감 강화 */
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        /* 마우스 오버 효과 (Hover Glow & Fill) */
        .select-button:hover {
            background: rgba(var(--color1-rgb), 0.15); /* 호버 시 배경 조금 더 밝게 */
            border-color: rgba(var(--color1-rgb), 0.6); /* 테두리 더 선명하게 */
            transform: translateY(-2px); /* 살짝 떠오르는 효과 */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* 선택된 상태 (.selected) */
        .select-button.selected {
            background: rgba(255, 255, 255, 0.9);
            color: #000; /* 선택시 텍스트 검정으로 반전 */
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
            transform: scale(1.05);
            font-weight: bold;
        }

        /* 클릭 효과 (.button:active) */
        .select-button:active {
            transform: scale(0.95);
        }

        /* * [4] Control Bar Style
         * 하단 컨트롤 바 스타일 (Glassmorphism)
         */
        .control-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            
            display: flex;
            gap: 25px;
            padding: 12px 30px;
            
            /* Glassmorphism */
            background: rgba(var(--color2-rgb), 0.15);
            border: 1px solid rgba(var(--color1-rgb), 0.2);
            border-radius: 50px;
            box-shadow: 0 8px 32px 0 rgba(var(--color3-rgb), 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 10;
        }

        .icon-btn {
            color: rgba(var(--color1-rgb), 0.8);
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
        }

        .icon-btn:hover {
            color: rgba(var(--color1-rgb), 1);
            text-shadow: 0 0 10px rgba(var(--color1-rgb), 0.6);
            transform: scale(1.2);
        }
        
        .icon-btn:active {
            transform: scale(0.95);
        }

    </style>
</head>
<body>

    <!-- [Modified] Car Dashboard Style Container -->
    <div id="dashboard_panel" class="dashboard-container">
        
        <!-- Left Sidebar (Menu) -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>설정</h2>
            </div>
            <ul class="sidebar-menu">
                <li class="active">여행 스타일</li>
                <li>나의 스타일</li>
            </ul>
        </div>

        <!-- Right Content Area (Main) -->
        <div class="content-area">
            
            <!-- [VIEW 1] Survey Page -->
            <div id="survey_view">
                <div class="content-header">
                    <h3>여행 스타일</h3>
                    <p>여행 스타일을 선택해주세요</p>
                </div>

                <!-- Choices Grid -->
                <div class="choices-grid">
                    <!-- Row 1: 산(-1) vs 바다(1) -->
                    <div class="choice-group">
                        <span class="group-label">장소</span>
                        <div class="choice-row">
                            <div class="select-button" data-row="1" onclick="selectOption(this, 1, -1)">산</div>
                            <div class="select-button" data-row="1" onclick="selectOption(this, 1, 1)">바다</div>
                        </div>
                    </div>

                    <!-- Row 2: 카페(-1) vs 아아(1) -->
                    <div class="choice-group">
                        <span class="group-label">휴식</span>
                        <div class="choice-row">
                            <div class="select-button" data-row="2" onclick="selectOption(this, 2, -1)">카페</div>
                            <div class="select-button" data-row="2" onclick="selectOption(this, 2, 1)">아아</div>
                        </div>
                    </div>

                    <!-- Row 3: 실내(-1) vs 실외(1) -->
                    <div class="choice-group">
                        <span class="group-label">공간</span>
                        <div class="choice-row">
                            <div class="select-button" data-row="3" onclick="selectOption(this, 3, -1)">실내</div>
                            <div class="select-button" data-row="3" onclick="selectOption(this, 3, 1)">실외</div>
                        </div>
                    </div>

                    <!-- Row 4: 액티비티(-1) vs 이쁜거(1) -->
                    <div class="choice-group">
                        <span class="group-label">활동</span>
                        <div class="choice-row">
                            <div class="select-button" data-row="4" onclick="selectOption(this, 4, -1)">액티비티</div>
                            <div class="select-button" data-row="4" onclick="selectOption(this, 4, 1)">이쁜거</div>
                        </div>
                    </div>
                </div>

                <!-- Result Button (Hidden by default) -->
                <div id="btn_show_result" class="action-button-container" style="display:none; margin-top: 30px; text-align: right;">
                    <div class="select-button" style="width: 100%; background: rgba(var(--color1-rgb), 0.2); border-color: rgba(var(--color1-rgb), 0.5);" onclick="showResult()">
                        결과 보기 →
                    </div>
                </div>
            </div>

            <!-- [VIEW 2] Result Page (Character Selection) -->
            <div id="result_view" style="display: none; height: 100%; flex-direction: column;">
                <div class="content-header" style="margin-bottom: 10px;">
                    <h3 id="result_title">나의 스타일 분석 완료</h3>
                    <p id="result_desc">당신의 캐릭터를 선택해주세요.</p>
                </div>
                
                <!-- Character Cards Container (Horizontal Scroll/Flex) -->
                <div id="character_container" class="character-container">
                    <!-- Cards will be injected by JS -->
                </div>

                <!-- Navigation Controls -->
                <div style="margin-top: 20px; display: flex; gap: 20px; justify-content: center;">
                    <div class="select-button" style="width: 120px;" onclick="resetSurvey()">다시 하기</div>
                    <div id="btn_start" class="select-button start-button disabled" onclick="confirmCharacter()">시작하기</div>
                </div>
            </div>

        </div>
    </div>

    <!-- [NEW] Bottom Control Bar -->
    <div class="control-bar">
        <div class="icon-btn" title="Previous Scene" onclick="trace('Load Previous Scene')">◀</div>
        <div class="icon-btn" title="Zoom In" onclick="trace('Zoom In')">⊕</div>
        <div class="icon-btn" title="Zoom Out" onclick="trace('Zoom Out')">⊖</div>
        <div class="icon-btn" title="Next Scene" onclick="trace('Load Next Scene')">▶</div>
        <div class="icon-btn" title="Fullscreen" onclick="trace('Toggle Fullscreen')">⛶</div>
    </div>

    <script>
        // State to store answers and selected character
        let answers = { 1: null, 2: null, 3: null, 4: null };
        let selectedCharacter = null;

        // Binary Choice Selection Logic
        function selectOption(el, row, value) {
            // 1. Deselect all buttons in the same row
            const buttons = document.querySelectorAll(`.select-button[data-row="${row}"]`);
            buttons.forEach(btn => btn.classList.remove('selected'));

            // 2. Select the clicked button
            el.classList.add('selected');
            
            // 3. Store Value
            answers[row] = value;
            trace(`Row ${row} selected: ${value}`);

            // 4. Check Completion
            checkCompletion();
        }

        function checkCompletion() {
            const allAnswered = Object.values(answers).every(val => val !== null);
            const btnContainer = document.getElementById('btn_show_result');
            
            if (allAnswered) {
                btnContainer.style.display = 'block';
                document.querySelector('.content-area').scrollTop = document.querySelector('.content-area').scrollHeight;
            }
        }

        function showResult() {
            // 1. Calculate Score & Type
            const totalScore = Object.values(answers).reduce((acc, curr) => acc + curr, 0);
            
            let winnerType = 'NEUTRAL';
            let winnerName = '중립 (Neutral)';
            
            if (totalScore > 0) {
                winnerType = 'TETO';
                winnerName = '테토 (TETO)';
            } else if (totalScore < 0) {
                winnerType = 'EGEN';
                winnerName = '에겐 (EGEN)';
            }

            // 2. Update Header
            document.getElementById('result_title').innerText = `당신의 성향: ${winnerName}`;
            document.getElementById('result_desc').innerText = "당신의 캐릭터를 선택해주세요.";
            
            // 3. Generate Cards (All 4 types)
            const container = document.getElementById('character_container');
            container.innerHTML = ''; 

            // Define ALL characters
            const allChars = [
                { id: 'TETO_M', type: 'TETO', name: '테토남', desc: '활동적 스타일' },
                { id: 'TETO_F', type: 'TETO', name: '테토녀', desc: '유쾌한 스타일' },
                { id: 'EGEN_M', type: 'EGEN', name: '에겐남', desc: '차분한 스타일' },
                { id: 'EGEN_F', type: 'EGEN', name: '에겐녀', desc: '감성적 스타일' }
            ];

            // Sorting: Winner type comes first (if not neutral)
            /*
            allChars.sort((a,b) => {
                if (winnerType === 'NEUTRAL') return 0;
                if(a.type === winnerType && b.type !== winnerType) return -1;
                if(a.type !== winnerType && b.type === winnerType) return 1;
                return 0;
            });
            */
            // [Modified] 중립일 경우 정렬하지 않고 기본 순서 유지, 아닐 경우 승자 그룹 앞으로

             if (winnerType !== 'NEUTRAL') {
                allChars.sort((a,b) => {
                    if(a.type === winnerType && b.type !== winnerType) return -1;
                    if(a.type !== winnerType && b.type === winnerType) return 1;
                    return 0;
                });
             }

            allChars.forEach((char) => {
                // If Neutral, EVERYONE is a winner
                const isWinner = (winnerType === 'NEUTRAL') || (char.type === winnerType);
                
                const card = document.createElement('div');
                card.className = 'character-card';
                card.dataset.id = char.id;
                card.dataset.type = char.type; // [NEW] Store Type
                
                // Initialize States
                if (isWinner) {
                    card.classList.add('winner-type');
                } else {
                    card.classList.add('disabled');
                }
                
                // Always add click event
                card.onclick = () => selectCharacter(char.id, char.type, card);
                
                card.innerHTML = `
                    <div class="card-image-placeholder">${char.name}</div>
                    <div class="card-info">
                        <h4>${char.name}</h4>
                        <p>${char.desc}</p>
                    </div>
                `;
                container.appendChild(card);
            });
            
            // Reset Select State
            selectedCharacter = null;
            document.getElementById('btn_start').classList.add('disabled');
            
            // 4. Switch View
            document.getElementById('survey_view').style.display = 'none';
            document.getElementById('result_view').style.display = 'flex';
            
            // [NEW] Disable Vertical Scroll for Result View
            document.querySelector('.content-area').style.overflowY = 'hidden';

            updateSidebar(1);
            
            trace(`Result Logic: Score=${totalScore}, Winner=${winnerType}`);
        }

        function selectCharacter(charId, type, cardEl) {
            selectedCharacter = charId;
            
            // [NEW] Dynamic Group Switching Logic
            const allCards = document.querySelectorAll('.character-card');
            
            allCards.forEach(card => {
                // 1. Remove Selection from all
                card.classList.remove('selected');
                
                // 2. Adjust Group styling based on selected type
                if (card.dataset.type === type) {
                    // This is the active group
                    card.classList.remove('disabled');
                    card.classList.add('winner-type');
                } else {
                    // This is the inactive group
                    card.classList.remove('winner-type');
                    card.classList.add('disabled');
                }
            });

            // 3. Highlight Selected Card
            cardEl.classList.add('selected');
            
            // Enable Start Button
            const btn = document.getElementById('btn_start');
            btn.classList.remove('disabled');
            
            trace(`Character selected: ${charId} (Type: ${type})`);
        }

        function confirmCharacter() {
            if(!selectedCharacter) return; // Prevent click if disabled
            
            alert(`[System] ${selectedCharacter} 캐릭터로 투어를 시작합니다!`);
            // 추후 실제 투어 씬 로드 기능 연결
        }

        function resetSurvey() {
            answers = { 1: null, 2: null, 3: null, 4: null };
            selectedCharacter = null;
            
            document.querySelectorAll('.select-button.selected').forEach(btn => btn.classList.remove('selected'));
            document.getElementById('btn_show_result').style.display = 'none';
            
            document.getElementById('survey_view').style.display = 'block';
            document.getElementById('result_view').style.display = 'none';
            
            // [NEW] Restore Scroll for Survey View
            document.querySelector('.content-area').style.overflowY = 'auto';

            updateSidebar(0);
        }

        function updateSidebar(activeIndex) {
            const items = document.querySelectorAll('.sidebar-menu li');
            items.forEach((item, index) => {
                if (index === activeIndex) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        function changeTheme(mode) {
            trace("Theme changed to: " + mode);
            document.documentElement.setAttribute('data-theme', mode);
        }

        function trace(msg) {
            console.log("[Krpano Log] " + msg);
        }
    </script>
</body>
</html>
